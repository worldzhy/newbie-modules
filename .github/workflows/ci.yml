name: CI

# Verification runs once, on the PR that promotes dev to main: that merge is
# the only path into main, and the tree the PR verifies is what the merge
# promotes, so main re-runs nothing. Dependabot PRs target dev and merge
# without a run; their updates are verified at the following dev -> main PR.
on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      # The shared backend eslint standard is syntactic only (no type-aware
      # rules), so it runs here without any module dependency installed.
      - run: npm run lint
      # Module-manifest gate (ADR-024 F17): every physical "@modules/<key>"
      # import must be declared in moduleDependencies, and layer edges must
      # point downward. The CLI owns the rule, so it is fetched at run time
      # instead of vendored into the registry. Pin the exact release: lint
      # semantics must not change under a floating major tag (R5-P2-16);
      # bump it deliberately alongside registry tooling changes.
      - run: npx --yes @devbie/newbie-cli@1.20.0 modules lint
      # Module business-logic tests (e.g. account/auth/login-audit-coverage.test.ts)
      # cannot run standalone here: this registry has no NestJS/zod/etc.
      # dependencies installed, by design (modules are copied into a consumer
      # project via `newbie modules apply`, not built in place). The real
      # enforcement point for those tests is the consumer's own CI
      # (see nightwatch-backend/.github/workflows/ci.yml `npm test`), which
      # picks them up once the module is assembled.
